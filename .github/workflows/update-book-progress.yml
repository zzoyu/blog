name: Update Book Progress

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: '도서 ID (예: ebs-50-math-1)'
        required: true
        type: string
      current_page:
        description: '현재 진행 페이지 수 (예: 120)'
        required: true
        type: string
      status:
        description: '도서 상태 (선택 사항: reading, done, waiting)'
        required: false
        type: choice
        options:
          - ''
          - 'reading'
          - 'done'
          - 'waiting'

jobs:
  update-progress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update data/books.yml using yq
        run: |
          # 💡 외부 스크립트 없이 yq로 data/books.yml 직접 편집
          yq e -i '.["${{ inputs.book_id }}"].current_page = ${{ inputs.current_page }}' data/books.yml

          if [ -n "${{ inputs.status }}" ]; then
            yq e -i '.["${{ inputs.book_id }}"].status = "${{ inputs.status }}"' data/books.yml
          fi

      - name: Commit and push updated books.yml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.yml
          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "chore(book): update reading progress for ${{ inputs.book_id }}"
            git push
          fi
